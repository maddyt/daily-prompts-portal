name: Daily Prompt Generation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      copilot_prompt:
        description: 'Optional prompt to save; if empty Copilot automation will generate one'
        required: false
        default: ''

jobs:
  generate-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/generate-daily-prompt.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COPILOT_PROMPT: ${{ github.event.inputs.copilot_prompt }}
          COPILOT_RESPONSE: ${{ github.event.inputs.copilot_prompt }}
